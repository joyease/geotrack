name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: 🔨 Build GeoTrack Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🐘 Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: 📝 Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 📄 Ensure google-services.json is configured
        env:
          GOOGLE_SERVICES_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          mkdir -p android/app
          
          # 1. 優先使用 GitHub Secret
          if [ -n "$GOOGLE_SERVICES_BASE64" ]; then
            echo "🔐 Using google-services.json from GitHub Secrets"
            echo "$GOOGLE_SERVICES_BASE64" | base64 -d > android/app/google-services.json

          # 2. 次要使用本機現有檔案 (若有的話)
          elif [ -f "android/app/google-services.json" ]; then
            echo "📁 Using existing android/app/google-services.json"
          elif [ -f "google-services.json" ]; then
            echo "📁 Copying root google-services.json to android/app/"
            cp google-services.json android/app/google-services.json

          # 3. 最後 Fallback (備用方案)
          else
            echo "⚠️ No Secret or file found, generating fallback..."
            echo "" | base64 -d > android/app/google-services.json
          fi

          ls -la android/app/google-services.json
          cp android/app/google-services.json ./google-services.json || true

      - name: 📦 Build Android Debug APK
        working-directory: ./android
        run: |
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace --info

      - name: ℹ️ Build Information & Fingerprints (Reference Only)
        working-directory: ./android
        run: |
          echo "💡 Note: App uses Email/Password auth with unrestricted API key, SHA-1 binding is not required."
          if [ -f ~/.android/debug.keystore ]; then
            keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android 2>/dev/null || true
          fi

      - name: 📤 Upload APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GeoTrack-Debug-APK
          path: |
            android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: 📄 Upload Build Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports-on-failure
          path: |
            android/app/build/reports/
            android/build/reports/
          retention-days: 7
