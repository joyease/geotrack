name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: 🔨 Build GeoTrack Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🐘 Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: 📝 Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 📄 Ensure google-services.json is configured
        run: |
          mkdir -p android/app
          if [ -f android/app/google-services.json ]; then
            echo "✅ Found android/app/google-services.json"
          elif [ -f google-services.json ]; then
            echo "📋 Copying root google-services.json to android/app/google-services.json"
            cp google-services.json android/app/google-services.json
          else
            echo "⚠️ Creating android/app/google-services.json from template..."
            cat << 'EOF' > android/app/google-services.json
{
  "project_info": {
    "project_number": "133122521568",
    "project_id": "geotrack-8e9b4",
    "storage_bucket": "geotrack-8e9b4.firebasestorage.app"
  },
  "client": [
    {
      "client_info": {
        "mobilesdk_app_id": "1:133122521568:android:51d7db5ef2979686995385",
        "android_client_info": {
          "package_name": "com.hh.geotrack"
        }
      },
      "oauth_client": [
        {
          "client_id": "133122521568-vhu0j2bbcoktbqvb9d2f3dk9k44da6j5.apps.googleusercontent.com",
          "client_type": 3
        }
      ],
      "api_key": [
        {
          "current_key": "AIzaSyBagcQG_7QSBvf0lSdYPmD4vH1VrOeToJY"
        }
      ],
      "services": {
        "appinvite_service": {
          "other_platform_oauth_client": [
            {
              "client_id": "133122521568-vhu0j2bbcoktbqvb9d2f3dk9k44da6j5.apps.googleusercontent.com",
              "client_type": 3
            }
          ]
        }
      }
    }
  ],
  "configuration_version": "1"
}
EOF
          fi
          # Also ensure root has a copy
          cp android/app/google-services.json ./google-services.json || true
          ls -la android/app/google-services.json

      - name: 📦 Build Android Debug APK
        working-directory: ./android
        run: |
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace --info

      - name: 🔑 Print SHA-1 & SHA-256 Fingerprints
        working-directory: ./android
        run: |
          echo "====================== GRADLE SIGNING REPORT ======================"
          ./gradlew signingReport || true
          echo "======================= KEYTOOL FINGERPRINTS ======================"
          if [ -f ~/.android/debug.keystore ]; then
            keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android || true
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            keytool -printcert -jarfile app/build/outputs/apk/debug/app-debug.apk || true
          fi

      - name: 📤 Upload APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GeoTrack-Debug-APK
          path: |
            android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: 📄 Upload Build Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports-on-failure
          path: |
            android/app/build/reports/
            android/build/reports/
          retention-days: 7
